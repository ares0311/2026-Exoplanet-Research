schema_version: 1
last_updated: 2026-07-12
project: 2026 Exoplanet Research
policy_sources:
  - docs/astrometrics_data_selection_policy.md
  - docs/astrometrics_coding_agents_master_guide.md
  - docs/astrometrics_external_and_cloud_storage_policy.md

datasets:
  - dataset_id: tess_cached_unlabeled_representation_v1
    role: training
    project: 2026 Exoplanet Research
    source: Existing NASA MAST TESS SPOC light-curve cache, metadata-only inventory
    allowed_uses:
      - Self-supervised representation pretraining with no label-derived objective
      - Estimate preprocessing/runtime/storage requirements before deriving any arrays
    forbidden_uses:
      - Supervised label fitting
      - Validation, calibration, threshold tuning, or frozen evaluation
      - Candidate discovery, review, or external submission
    split_group_keys:
      - TIC target ID
    manifest_path: artifacts/manifests/representation_cache_inventory_v1.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/tess_cached_unlabeled_representation_v1.json
    local_artifact_paths:
      - ~/.lightkurve/cache/mastDownload/TESS
    notes: >
      Merged-code metadata-only inventory completed 2026-07-12: 11,960 SPOC
      light-curve products across 2,790 TICs, 29.79762048 GB already cached.
      Every TIC in the listed local labeled corpora was excluded; none of the
      frozen tess_live_search_v1 TICs overlapped the SPOC cache. Unlabeled is a
      local-role statement, not an astrophysical guarantee. No FITS payloads
      were opened and no data were downloaded.

  - dataset_id: canonical_real_controls_v1
    role: frozen_eval
    project: 2026 Exoplanet Research
    source: Catalog-backed TESS outcomes preserved by formal_acceptance_v2
    allowed_uses:
      - Offline sample-level regression comparison against accepted confirmed-planet and false-positive outcomes
      - Release-gate detection of changed formal-acceptance outcomes
    forbidden_uses:
      - Model training, calibration, or threshold tuning
      - Discovery claims or external submission
      - Substitution for a population-level sensitivity study
    split_group_keys:
      - TIC target ID
    manifest_path: artifacts/manifests/canonical_regression_eval_v1.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/canonical_real_controls_v1.json
    local_artifact_paths: []
    notes: >
      Real-only frozen controls remain separate from injected cases. The
      offline suite compares immutable accepted outcomes and does not claim to
      re-fetch or reprocess the underlying light curves.

  - dataset_id: canonical_injected_controls_v1
    role: frozen_eval
    project: 2026 Exoplanet Research
    source: Deterministic project-generated TESS-like light curves with exact injection truth
    allowed_uses:
      - Detect sample-level transit-search recovery regressions
      - Compare current recovery metrics with the immutable v1 baseline
    forbidden_uses:
      - Supervised model training or calibration
      - Real-only performance claims
      - Discovery claims or external submission
    split_group_keys:
      - Synthetic control ID and random seed
    manifest_path: artifacts/manifests/canonical_regression_eval_v1.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/canonical_injected_controls_v1.json
    local_artifact_paths: []
    notes: >
      Synthetic-inclusive evaluation is deliberately isolated from the
      catalog-backed real-only role. Version 1 freezes a 2/2 deep-signal
      recovery and a 0/2 subthreshold non-recovery control.

  - dataset_id: tess_live_search_v1
    role: live_search
    project: 2026 Exoplanet Research
    source: MAST TIC catalog plus exact QLP light-curve product metadata
    allowed_uses:
      - Execute the bounded TESS QLP live-search batch recorded in its batch manifest
      - Populate schema-v2 candidate-ledger source_dataset_id and raw-product provenance
      - Record high-priority null results and candidate signals from the same frozen queue
    forbidden_uses:
      - Train or calibrate any model
      - Substitute for a labeled validation or frozen-evaluation set
      - Download target-pixel files without a separate follow-up manifest
      - Claim discovery or submit externally without explicit human approval
    split_group_keys:
      - TIC target ID
    manifest_path: data_selection/batch_manifests/tess_live_search_v1.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/tess_live_search_v1.json
    local_artifact_paths:
      - data_selection/target_priority_queue.csv
      - data_selection/target_priority_queue.tess_live_search_v1.csv
    notes: >
      Metadata-only preparation completed 2026-07-11. The immutable executable
      snapshot contains 18 targets and 103 exact QLP product URIs totaling an
      estimated 0.04565088 GB. Two additional inspected targets with no QLP
      products remain in the canonical queue as rejected_no_products. Selection
      excludes 7,753 TOIs, 3,787 CTOIs, 3,590 confirmed transiting hosts, and
      200 historical discovery targets. No raw light curves were downloaded.

  - dataset_id: t1_1_kepler_master_train
    role: training
    project: 2026 Exoplanet Research
    source: NASA Exoplanet Archive KOI cumulative table plus Q1_Q17_DR24_TCE expansion, converted to folded Kepler snippets
    allowed_uses:
      - Fit benchmark_cnn_v1 model parameters
      - Reproduce the selected master checkpoint training run
      - Fit the versioned Phase 3 masked-reconstruction pilot with labels hidden from the pretraining objective
    forbidden_uses:
      - Tune final thresholds
      - Report blind-search discoveries
      - Promote live-search candidates
    split_group_keys:
      - Kepler target group / KIC-level grouping via predefined manifest split
    manifest_path: data/t1_1_kepler_master_cnn_splits/manifest.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/t1_1_kepler_koi_training_v1.json
      - metadata/dataset_manifests/t1_1_kepler_dr24_training_v1.json
    local_artifact_paths:
      - data/processed/t1_1_kepler_master_combined.jsonl
      - data/t1_1_kepler_master_cnn_splits/train.json
    notes: Train split has 10800 examples, negative=8442, positive=2358. Local split files are ignored; committed manifests and ledgers preserve provenance.

  - dataset_id: t1_1_kepler_master_validation
    role: validation
    project: 2026 Exoplanet Research
    source: Same master Kepler corpus, predefined validation split
    allowed_uses:
      - Select best epoch by validation AUC
      - Fit temperature scaling calibration parameter
      - Early stopping and learning-rate scheduling
      - Select masked-reconstruction and frozen linear-probe states for the versioned Phase 3 pilot
    forbidden_uses:
      - Final held-out performance claim
      - Blind-search discovery claim
      - Full-ensemble stacking calibration after CNN promotion
    split_group_keys:
      - Kepler target group / KIC-level grouping via predefined manifest split
    manifest_path: data/t1_1_kepler_master_cnn_splits/manifest.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/t1_1_kepler_koi_training_v1.json
      - metadata/dataset_manifests/t1_1_kepler_dr24_training_v1.json
    local_artifact_paths:
      - data/t1_1_kepler_master_cnn_splits/val.json
      - checkpoints/cnn_t1_1_kepler_master/calibration.json
    notes: Validation split has 2393 examples, negative=1875, positive=518. Temperature scaling selected T=1.0.

  - dataset_id: t1_1_kepler_master_calibration
    role: calibration
    project: 2026 Exoplanet Research
    source: Validation split from the master Kepler corpus
    allowed_uses:
      - Fit temperature scaling for benchmark_cnn_v1
      - Check that calibration does not worsen Brier score or ECE
    forbidden_uses:
      - Train model weights
      - Report final held-out metrics
      - Tune future full-ensemble stacking weights
    split_group_keys:
      - Kepler target group / KIC-level grouping via predefined manifest split
    manifest_path: data/t1_1_kepler_master_cnn_splits/manifest.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/t1_1_kepler_koi_training_v1.json
      - metadata/dataset_manifests/t1_1_kepler_dr24_training_v1.json
    local_artifact_paths:
      - checkpoints/cnn_t1_1_kepler_master/calibration.json
    notes: This calibration role is intentionally narrow. T1-2 still needs a separate held-out calibration plan for stacker weights after CNN promotion.

  - dataset_id: t1_1_kepler_master_frozen_eval
    role: frozen_eval
    project: 2026 Exoplanet Research
    source: Predefined test split from the master Kepler corpus
    allowed_uses:
      - One-time benchmark_cnn_v1 promotion gate report
      - Regression comparison against future model families
      - One-time grouped-holdout evaluation of each versioned Phase 3 representation benchmark
    forbidden_uses:
      - Training
      - Epoch selection
      - Threshold tuning
      - Stacking weight calibration
      - Blind-search discovery claims
    split_group_keys:
      - Kepler target group / KIC-level grouping via predefined manifest split
    manifest_path: data/t1_1_kepler_master_cnn_splits/manifest.json
    dataset_manifest_paths:
      - metadata/dataset_manifests/t1_1_kepler_koi_training_v1.json
      - metadata/dataset_manifests/t1_1_kepler_dr24_training_v1.json
    local_artifact_paths:
      - data/t1_1_kepler_master_cnn_splits/test.json
      - checkpoints/cnn_t1_1_kepler_master/calibration.json
    notes: Frozen eval split has 2456 examples, negative=1919, positive=537. Held-out gate result is raw AUC=0.957211 and calibrated F1=0.834688.

  - dataset_id: historical_run006_run008_discovery_evidence
    role: live_search
    project: 2026 Exoplanet Research
    source: Historical QLP live scanner logs retained in local logs/
    allowed_uses:
      - Scanner provenance and future forensic review if explicitly requested
    forbidden_uses:
      - CNN training
      - CNN calibration
      - CNN frozen evaluation
      - Production gate closure for T1-1
    split_group_keys: []
    manifest_path: docs/LOCAL_ARTIFACT_LEDGER.md
    local_artifact_paths:
      - logs/discovery_run_006_qlp_progress_safe.json
      - logs/discovery_run_008_targeted_qlp_stitch_safe.json
    notes: Historical only. The active production path is the dataset/model-training plan, not the old run006/run008 loop.

  - dataset_id: t1_2_k2pandc_calibration
    role: calibration
    project: 2026 Exoplanet Research
    source: NASA Exoplanet Archive K2 planets-and-candidates table (k2pandc), native K2 light curves
    allowed_uses:
      - Score with the already-trained xgboost_koi.json and benchmark_cnn_v1 scorers plus the Bayesian log-score model
      - Grid-search Tier-3 stacking blend weights (ensemble_weight_optimizer.py / calibrate_stacking_weights.py) for T1-2
      - Derive empirical full-ensemble score quantiles and observed false-discovery fractions with explicit K2-domain and selected-class-balance limitations
    forbidden_uses:
      - Train XGBoost or CNN model weights
      - Report a final held-out performance claim for benchmark_cnn_v1 (that role belongs to t1_1_kepler_master_frozen_eval)
      - Reuse these same EPIC targets as a future T1-1-style Kepler/K2 CNN training-corpus expansion (would create a train/calibration overlap once consumed here)
      - Blind-search discovery claims
      - Treat empirical K2 false-discovery fractions as guaranteed operational FDR bounds or probability calibration
      - Define or tune a production decision threshold without a separate approved threshold-selection plan
    split_group_keys:
      - K2 EPIC target (one calibration row per star; k2:epic:<id> group keys, disjoint from the kepler:kic:<id> namespace used by T1-1 by construction)
    manifest_path: metadata/t1_2_k2_calibration_manifest.jsonl
    dataset_manifest_paths:
      - metadata/dataset_manifests/t1_2_k2_stacking_calibration_v1.json
    local_artifact_paths:
      - data/t1_2_k2_calibration_snippets.jsonl
      - metadata/t1_2_k2_calibration_partial_predictions.jsonl
    context_artifact_path: models/candidate_context_v1.json
    notes: >
      596 rows (356 CONFIRMED / 240 FALSE POSITIVE) selected 2026-07-10 from
      2,261 live-verified usable k2pandc rows; disjoint EPIC namespace from
      the Kepler KIC-based T1-1 training/validation/frozen-eval splits, so it
      carries zero group-level leakage risk against benchmark_cnn_v1 or
      xgboost_koi.json by construction. Bayesian and XGBoost scores are
      already computed catalog-only (metadata/t1_2_k2_calibration_partial_predictions.jsonl);
      the CNN score requires a bounded live fetch of native K2 light curves
      (fetch_t1_2_k2_calibration_snippets.py, human-run on the operator's Mac)
      before calibrate_stacking_weights.py can produce final T1-2 weights.
      The completed 588-row prediction subset may also support descriptive
      full-ensemble score-rank and observed tail-negative context. This does
      not change the dataset role, probability-calibrate the score, define a
      threshold, or make its selected K2 class balance representative of TESS
      live-search prevalence.
      Two real unit bugs were found and fixed while building this dataset:
      (1) k2pandc's pl_tranmid is already full BJD_TDB, not BKJD as an
      existing script (fetch_tess_k2_overlap_snippets.py) assumed -- that
      script's already-fetched data/tess_k2_overlap_snippets.jsonl (2,086
      snippets, TESS-domain, unrelated to this calibration set) has a
      corrupted phase-fold epoch and must be re-fetched before any future
      use; (2) k2pandc's pl_trandur is empirically in hours despite its own
      tap_schema.columns metadata claiming days (cross-checked against
      published K2-18 b and K2-3 b transit durations).
